name: Bug
description: Reproducible defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Build, device and environment
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or traces
  - type: textarea
    id: regression
    attributes:
      label: Proposed regression test
