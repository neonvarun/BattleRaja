name: Repository validation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static repository, LFS and secret checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Validate repository contract
        shell: pwsh
        run: .\Tools\Validation\validate.ps1 -ProjectRoot $env:GITHUB_WORKSPACE

      - name: Check whitespace and LFS integrity
        shell: pwsh
        run: |
          git diff --check
          git lfs fsck --pointers

      - name: Scan tracked source for forbidden secret assignments
        shell: pwsh
        run: |
          $pattern = '(?i)(api[_-]?key|client[_-]?secret|access[_-]?token|private[_-]?key|password)\s*[:=]\s*[A-Za-z0-9_./+=-]{8,}'
          $paths = @('Assets', 'Packages', 'ProjectSettings', 'Tools', '.github') | Where-Object { Test-Path -LiteralPath $_ }
          $hits = @(git grep -n -I -E $pattern -- $paths 2>$null)
          if ($LASTEXITCODE -eq 0 -and $hits.Count -gt 0) {
            $hits | Write-Output
            throw 'Potential secret assignment detected in tracked source.'
          }
